# IntelliDesk Phase 7 Wave 5 — Nginx reverse proxy (single `web` runtime image)
#
# Topology (production-style):
#   Browser -> :80 (web/Nginx)
#       /          -> Vue static dist (built into the image, no shared volume)
#       /api/*     -> proxy_pass http://backend:8080
#   /actuator/* is NOT routed here (internal scalar only).
#
# Trusted-proxy safety: the ONLY client-facing peer is this Nginx instance, and
# the backend host port is NOT exposed. Nginx OVERWRITES X-Forwarded-For and the
# RFC 7239 `Forwarded` header with $remote_addr (the real TCP source the browser
# used to reach Nginx), so a caller cannot spoof their IP by sending a forged
# X-Forwarded-For / Forwarded header. The backend resolves the real client IP
# through Spring Boot's official `server.forward-headers-strategy` — it never
# hand-parses arbitrary X-Forwarded-For values in business code.

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # ---- Security headers ----
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---- Gzip ----
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml text/xml;
    gzip_min_length 1024;

    server {
        listen 80;
        server_name localhost;

        # Vue SPA static files (already built into the image at build time)
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        # ---- Backend API + SSE reverse proxy ----
        location /api/ {
            proxy_pass http://backend:8080;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # Anti-spoof: overwrite (never append) with the real source IP seen by Nginx.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Forwarded "for=$remote_addr;proto=$scheme";

            # SSE: MUST disable buffering / caching (RAG + Agent streaming).
            proxy_buffering off;
            proxy_cache off;
            proxy_redirect off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            # Upload limit matches backend multipart max-request-size (25MB baseline).
            client_max_body_size 25m;
        }

        # ---- Lightweight /ping endpoint for Phase 8 Wave 2 HTTP-Concurrency benchmark ----
        # Does not proxy to backend; returns a minimal 200 from Nginx itself.
        location = /ping {
            access_log off;
            return 200 "pong\n";
            add_header Content-Type text/plain;
        }

        # ---- Public /api/health endpoint for Phase 8 Wave 2 HTTP-Concurrency benchmark ----
        # Served directly by Nginx so the benchmark target matches the approved frozen config.
        location = /api/health {
            access_log off;
            return 200 '{"status":"UP","component":"intellidesk-nginx"}';
            add_header Content-Type application/json;
        }

        # ---- Actuator is INTENTIONALLY not routed here (explicit deny, not SPA fallback) ----
        location ^~ /actuator {
            return 404;
        }
        location = /actuator {
            return 404;
        }
    }
}